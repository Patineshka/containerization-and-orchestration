owner: patineshka

api:
  replicas: 4
  image:
    repository: docker.io/library/shop-api
    tag: v2
    pullPolicy: Never
  healthFail: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicas: 2
  image:
    repository: docker.io/library/shop-worker
    tag: v1
    pullPolicy: Never
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi


postgres:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  database: shop
  owner: shop
  storage:
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi