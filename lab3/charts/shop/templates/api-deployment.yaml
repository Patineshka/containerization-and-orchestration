apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 5
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: {{ .Release.Name }}-api

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
        owner: {{ .Values.owner | quote }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}

            - name: APP_VERSION
              value: {{ .Values.api.image.tag | quote }}

            - name: OTEL_SERVICE_NAME
              value: shop-api

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.monitoring.svc.cluster.local:4317

            - name: PGHOST
              value: {{ printf "%s-postgres-rw" .Release.Name | quote }}

            - name: PGPORT
              value: "5432"

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: dbname

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: username

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres-app
                  key: password

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}