apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: allowed-images
spec:
  validationActions:
    - Deny

  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - monitoring
            - cnpg-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('docker.io/library/shop-api:') ||
          c.image.startsWith('docker.io/library/shop-worker:') ||
          c.image.startsWith('docker.io/library/busybox:') ||
          c.image.startsWith('docker.io/library/lab2-api:') ||
          c.image.startsWith('ghcr.io/cloudnative-pg/postgresql:') ||
          c.image == 'ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1'
        )
      message: "Image repository is not allowed"

    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c,
          c.image.startsWith('docker.io/library/shop-api:') ||
          c.image.startsWith('docker.io/library/shop-worker:') ||
          c.image.startsWith('docker.io/library/busybox:') ||
          c.image.startsWith('docker.io/library/lab2-api:') ||
          c.image.startsWith('ghcr.io/cloudnative-pg/postgresql:') ||
          c.image == 'ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1'
        )
      message: "Init container image repository is not allowed"