apiVersion: v1
kind: Pod
metadata:
  name: host-network-test
  namespace: lab3
  labels:
    app: policy-test
    owner: patineshka
spec:
  hostNetwork: true
  containers:
    - name: test
      image: docker.io/library/busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        privileged: false
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"