# Source: shop/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
spec:
  replicas: 4

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 5
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: shop-api

  template:
    metadata:
      labels:
        app: shop-api
        owner: "patineshka"
    spec:
      priorityClassName: "shop-critical"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: shop-api
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: api
          image: "docker.io/library/shop-api:v2"
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: HEALTH_FAIL
              value: "false"
            - name: APP_VERSION
              value: "v2"
            - name: OTEL_SERVICE_NAME
              value: shop-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.monitoring.svc.cluster.local:4317
            - name: PGHOST
              value: "shop-postgres-rw"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-app
                  key: dbname
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-postgres-app
                  key: password

          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 128Mi

