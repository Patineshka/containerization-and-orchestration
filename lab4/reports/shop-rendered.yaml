# Source: shop/templates/postgres-cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-postgres
spec:
  priorityClassName: "shop-critical"
  enablePDB: true
  affinity:
    nodeSelector:
      kubernetes.io/hostname: lab2
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie"

  inheritedMetadata:
    labels:
      app: shop-postgres
      owner: "patineshka"

  bootstrap:
    initdb:
      database: "shop"
      owner: "shop"

  storage:
    size: "2Gi"
    storageClass: "standard"

  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
