# Source: shop/templates/prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: shop
      rules:
        - alert: ShopAPIDown
          expr: |
            (
              max(up{
                namespace="lab3",
                service="shop-api"
              }) == 0
            )
            or
            absent(up{
              namespace="lab3",
              service="shop-api"
            })
          for: 1m
          labels:
            severity: critical
            namespace: "lab3"
            service: "shop-api"
          annotations:
            summary: "Все цели shop API недоступны для сбора метрик"
            description: "Проверить Pod API, readiness-пробы, Service и доступность приложения."
        
        - alert: ShopHighErrorRate
          expr: |
            (
              sum(rate(api_requests_total{
                namespace="lab3",
                service="shop-api",
                status=~"5.."
              }[1m]))
              /
              clamp_min(
                sum(rate(api_requests_total{
                  namespace="lab3",
                  service="shop-api"
                }[1m])),
                0.000001
              )
            ) > 0.20
          for: 1m
          labels:
            severity: critical
            namespace: "lab3"
            service: "shop-api"
          annotations:
            summary: "Более 20% запросов shop API завершаются ошибками"
            description: "Проверить ошибки API, доступность PostgreSQL и последние изменения приложения."

        - alert: ShopWorkerStalled
          expr: |
            (
              time() -
              max(
                shop_worker_last_success_timestamp_seconds{
                  namespace="lab3",
                  service="shop-worker"
                }
                and on(namespace, pod)
                (
                  up{
                    namespace="lab3",
                    service="shop-worker"
                  } == 1
                )
              ) > 60
            )
            or
            absent(
              shop_worker_last_success_timestamp_seconds{
                namespace="lab3",
                service="shop-worker"
              }
              and on(namespace, pod)
              (
                up{
                  namespace="lab3",
                  service="shop-worker"
                } == 1
              )
            )
          for: 1m
          labels:
            severity: critical
            namespace: "lab3"
            service: "shop-worker"
          annotations:
            summary: "Нет свежих успешных опросов БД от worker"
            description: "Проверить реплики worker, ошибки подключения к PostgreSQL и состояние базы."
