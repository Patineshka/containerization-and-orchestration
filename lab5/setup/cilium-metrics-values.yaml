prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring

hubble:
  enabled: true
  metrics:
    enabled:
      - "drop:labelsContext=source_namespace,destination_namespace"
      - "tcp:labelsContext=source_namespace,destination_namespace"
      - "flow:labelsContext=source_namespace,destination_namespace"
      - "dns:labelsContext=source_namespace,destination_namespace"
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
