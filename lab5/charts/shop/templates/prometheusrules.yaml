apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: shop
      rules:
        - alert: ShopAPIDown
          expr: |
            (
              max(up{
                namespace="{{ .Release.Namespace }}",
                service="{{ .Release.Name }}-api"
              }) == 0
            )
            or
            absent(up{
              namespace="{{ .Release.Namespace }}",
              service="{{ .Release.Name }}-api"
            })
          for: 1m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            service: {{ printf "%s-api" .Release.Name | quote }}
          annotations:
            summary: "Все цели shop API недоступны для сбора метрик"
            description: "Проверить Pod API, readiness-пробы, Service и доступность приложения."
        
        - alert: ShopHighErrorRate
          expr: |
            (
              sum(rate(api_requests_total{
                namespace="{{ .Release.Namespace }}",
                service="{{ .Release.Name }}-api",
                status=~"5.."
              }[1m]))
              /
              clamp_min(
                sum(rate(api_requests_total{
                  namespace="{{ .Release.Namespace }}",
                  service="{{ .Release.Name }}-api"
                }[1m])),
                0.000001
              )
            ) > 0.20
          for: 1m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            service: {{ printf "%s-api" .Release.Name | quote }}
          annotations:
            summary: "Более 20% запросов shop API завершаются ошибками"
            description: "Проверить ошибки API, доступность PostgreSQL и последние изменения приложения."

        - alert: ShopWorkerStalled
          expr: |
            (
              time() -
              max(
                shop_worker_last_success_timestamp_seconds{
                  namespace="{{ .Release.Namespace }}",
                  service="{{ .Release.Name }}-worker"
                }
                and on(namespace, pod)
                (
                  up{
                    namespace="{{ .Release.Namespace }}",
                    service="{{ .Release.Name }}-worker"
                  } == 1
                )
              ) > 60
            )
            or
            absent(
              shop_worker_last_success_timestamp_seconds{
                namespace="{{ .Release.Namespace }}",
                service="{{ .Release.Name }}-worker"
              }
              and on(namespace, pod)
              (
                up{
                  namespace="{{ .Release.Namespace }}",
                  service="{{ .Release.Name }}-worker"
                } == 1
              )
            )
          for: 1m
          labels:
            severity: critical
            namespace: {{ .Release.Namespace | quote }}
            service: {{ printf "%s-worker" .Release.Name | quote }}
          annotations:
            summary: "Нет свежих успешных опросов БД от worker"
            description: "Проверить реплики worker, ошибки подключения к PostgreSQL и состояние базы."