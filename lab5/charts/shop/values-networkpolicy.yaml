      "postgres-to-apiserver": {
        "endpointSelector": {
          "matchLabels": {
            "app": "shop-postgres"
          }
        },
        "egress": [
          {
            "toEntities": [
              "kube-apiserver"
            ],
            "toPorts": [
              {
                "ports": [
                  {
                    "port": "443",
                    "protocol": "TCP"
                  },
                  {
                    "port": "8443",
                    "protocol": "TCP"
                  }
                ]
              }
            ]
          },
          {
            "toCIDR": [
              "10.96.0.1/32"
            ],
            "toPorts": [
              {
                "ports": [
                  {
                    "port": "443",
                    "protocol": "TCP"
                  }
                ]
              }
            ]
          }
        ]
      },
      "client-to-nodeport": {
        "endpointSelector": {
          "matchLabels": {
            "app": "shop-client"
          }
        },
        "egress": [
          {
            "toEntities": [
              "host",
              "remote-node"
            ],
            "toPorts": [
              {
                "ports": [
                  {
                    "port": "30080",
                    "protocol": "TCP"
                  }
                ]
              }
            ]
          }
        ]
      },
      "nodeport-to-api": {
        "endpointSelector": {
          "matchLabels": {
            "app": "shop-api"
          }
        },
        "ingress": [
          {
            "fromEntities": [
              "remote-node"
            ],
            "toPorts": [
              {
                "ports": [
                  {
                    "port": "8080",
                    "protocol": "TCP"
                  }
                ]
              }
            ]
          }
        ]
      },
      "converted-default-deny": {
        "endpointSelector": {
          "matchLabels": {}
        },
        "enableDefaultDeny": {
          "ingress": true,
          "egress": true
        },
        "ingress": [
          {}
        ],
        "egress": [
          {}
        ]
      },
      "converted-allow-dns": {
        "endpointSelector": {
          "matchExpressions": [
            {
              "key": "k8s:app",
              "operator": "In",
              "values": [
                "shop-api",
                "shop-worker",
                "shop-postgres",
                "shop-client"
              ]
            }
          ],
          "matchLabels": {}
        },
        "enableDefaultDeny": {
          "egress": true
        },
        "egress": [
          {
            "toEndpoints": [
              {
                "matchLabels": {
                  "k8s:k8s-app": "kube-dns",
                  "k8s:io.kubernetes.pod.namespace": "kube-system"
                }
              }
            ],
            "toPorts": [
              {
                "ports": [
                  {
                    "port": "53",
                    "protocol": "UDP"
                  },
                  {
                    "port": "53",
                    "protocol": "TCP"
                  }
                ]
              }
            ]
          }
        ]
      },
      "converted-allow-api-ingress": {
        "endpointSelector": {
          "matchLabels": {
            "k8s:app": "shop-api"
