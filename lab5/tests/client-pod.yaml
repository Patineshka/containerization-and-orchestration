apiVersion: v1
kind: Pod
metadata:
  name: shop-client
  namespace: lab3
  labels:
    app: shop-client
    owner: patineshka
spec:
  containers:
    - name: client
      image: docker.io/library/shop-worker:v1
      imagePullPolicy: Never
      command: ["python3", "-c", "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
