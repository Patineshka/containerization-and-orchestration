apiVersion: v1
kind: Namespace
metadata:
  name: lab5-outsider
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: lab5-outsider
  labels:
    app: shop-outsider
    owner: patineshka
spec:
  containers:
    - name: test
      image: docker.io/library/shop-worker:v1
      imagePullPolicy: Never
      command: ["python3", "-c", "import time; time.sleep(86400)"]
      securityContext:
        privileged: false
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
